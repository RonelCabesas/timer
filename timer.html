<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<style>
body{margin:0; background:#f2f2f2; font-family:Arial; display:flex; flex-direction:column; height:100vh;}
.title{font-size:20px; padding:25px;}
.picker{display:flex; justify-content:center; align-items:center; gap:10px; margin-top:40px;}
.col{width:80px; height:220px; overflow-y:scroll; scroll-snap-type:y mandatory; text-align:center;}
.col::-webkit-scrollbar{display:none;}
.col span{display:block; font-size:40px; padding:12px 0; color:#bbb; scroll-snap-align:center;}
.col span.active{color:#000; font-weight:bold;}
.line{width:1px; height:200px; background:#ddd;}
.display{font-size:65px; text-align:center; margin-top:100px; display:none;}
.btn{width:150px; height:60px; background:white; border:0; border-radius:30px; margin:auto; font-size:26px; color:#2196F3; box-shadow:0 4px 12px rgba(0,0,0,.15); cursor:pointer;}
</style>
</head>
<body>

<div class="title">Timer</div>
<div class="picker" id="picker">
  <div class="col" id="h"></div><div class="line"></div>
  <div class="col" id="m"></div><div class="line"></div>
  <div class="col" id="s"></div><div class="line"></div>
</div>

<div class="display" id="display">00:00:00</div>
<button class="btn" id="btn" onclick="start()">▶</button>

<audio id="alarm" loop>
  <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
</audio>

<script>
//saves your 3 scroll columns and 3 selected time values so you don't have to search for them every time.
const h = document.getElementById('h');
const m = document.getElementById('m');
const s = document.getElementById('s');
let H=0, M=0, S=0;

//creates the numbers inside one column.
function make(col, max){
  col.innerHTML = "";
  for(let i=0;i<=max;i++){
    const sp = document.createElement('span');
    sp.textContent = String(i).padStart(2,'0');
    col.appendChild(sp);
  }
  col.addEventListener('scroll', () => updateAll());
}

make(h,23);
make(m,59);
make(s,59);

// make the starting number at the center
function applyPaddingAndInit(col){
  const first = col.querySelector('span');
  if(!first) return;
  const itemH = first.offsetHeight;
  const pad = (col.clientHeight/2) - (itemH/2); // computation to get the center of the column
  col.style.paddingTop = pad + "px";// starting point is in the center
  col.style.paddingBottom = pad + "px";
  col.style.boxSizing = "border-box";
  col.dataset.itemH = String(itemH);
  col.scrollTop = 0; // start at 00
}

// wait a tick so offsetHeight is correct
setTimeout(() => {
  applyPaddingAndInit(h);
  applyPaddingAndInit(m);
  applyPaddingAndInit(s);
  updateAll();
}, 0);

//This function decides which number should be black/highlighted when you scroll.
function updateCol(col){
  const itemH = Number(col.dataset.itemH || 64);
  const children = [...col.children];
  let idx = Math.round(col.scrollTop / itemH); // how far you scrolled
  idx = Math.max(0, Math.min(idx, children.length - 1)); //avoid scroll the limit value
  children.forEach(c => c.classList.remove('active'));
  if(children[idx]) children[idx].classList.add('active');
  return idx;
}
